services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: commons
      POSTGRES_USER: commons
      POSTGRES_PASSWORD: commons
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commons -d commons"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  backend:
    build:
      context: .
      dockerfile: backend/Commons.Api/Dockerfile
      target: development
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ArtifactsPath: /artifacts
      ConnectionStrings__Commons: Host=database;Port=5432;Database=commons;Username=commons;Password=commons
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/src/backend
      - backend-build-artifacts:/artifacts

  frontend:
    build:
      context: frontend/commons-web
      dockerfile: Dockerfile
      target: development
    environment:
      VITE_API_BASE_URL: http://localhost:8080
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/commons-web:/app
      - frontend-node-modules:/app/node_modules

volumes:
  backend-build-artifacts:
  postgres-data:
  frontend-node-modules:
