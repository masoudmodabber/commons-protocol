name: Mobile Validation

on:
  pull_request:
    paths:
      - "frontend/commons-mobile/**"
      - ".github/workflows/mobile-validation.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/commons-mobile/**"
      - ".github/workflows/mobile-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, test, and bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/commons-mobile
    env:
      APP_VARIANT: development
      EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:8080

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/commons-mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run mobile tests
        run: npm test -- --runInBand --forceExit

      - name: Run Expo Doctor
        run: npm run doctor

      - name: Validate Android bundle
        run: npm run export:android

      - name: Validate iOS bundle
        run: npm run export:ios
